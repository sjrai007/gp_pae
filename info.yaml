# Tiny Tapeout project information
project:
  title:        "GP_PAE — Reprogrammable Protocol Emulator"
  author:       ""      # TODO: fill in team name(s) before submission
  discord:      ""      # TODO
  description:  "N-lane programmable pin sequencer (tiny per-lane CPU) that emulates UART, SPI and I2C, reprogrammable post-fabrication for new protocols"
  language:     "Verilog" # generated from Hardcaml (OCaml) — see hardcaml/, checked-in output in src/generated/
  clock_hz:     50000000 # 50 MHz baseline (TT template default); revisit after STA

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  # The competition rules state this chipathon's allocation explicitly:
  # "Set the tile size in info.yaml to 6x4." (max 6x4 tiles, ~0.7mm^2; the
  # organizers are evaluating a possible bump to 8x4 and will announce it.)
  # This supersedes the template's standard 1x1..8x2 menu.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_gp_pae"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "generated/core.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs — dedicated in; also the config-port data-in byte when the loader is addressed
  ui[0]: "cfg_data[0] / lane pin"
  ui[1]: "cfg_data[1] / lane pin"
  ui[2]: "cfg_data[2] / lane pin"
  ui[3]: "cfg_data[3] / lane pin"
  ui[4]: "cfg_data[4] / lane pin"
  ui[5]: "cfg_data[5] / lane pin"
  ui[6]: "cfg_data[6] / lane pin"
  ui[7]: "cfg_data[7] / lane pin"

  # Outputs — dedicated out; also config-port data-out/status
  uo[0]: "cfg_status[0] / lane pin"
  uo[1]: "cfg_status[1] / lane pin"
  uo[2]: "cfg_status[2] / lane pin"
  uo[3]: "cfg_status[3] / lane pin"
  uo[4]: "cfg_status[4] / lane pin"
  uo[5]: "cfg_status[5] / lane pin"
  uo[6]: "cfg_status[6] / lane pin"
  uo[7]: "cfg_status[7] / lane pin"

  # Bidirectional pins — scarce resource for open-drain-style I2C / USB D+D-
  uio[0]: "cfg_strobe / lane pin (bidir)"
  uio[1]: "cfg_addr_latch / lane pin (bidir)"
  uio[2]: "lane pin (bidir)"
  uio[3]: "lane pin (bidir)"
  uio[4]: "lane pin (bidir)"
  uio[5]: "lane pin (bidir)"
  uio[6]: "lane pin (bidir)"
  uio[7]: "lane pin (bidir)"

# Do not change!
yaml_version: 6
